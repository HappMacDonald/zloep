<!doctype html><meta charset="utf-8"><title>spike3</title>
<p>W <input id="w" value="640" size="4"> H <input id="h" value="360" size="4"> <button id="go">build</button>
<a id="dl" download="spike3.webp"></a></p>
<img id="im" style="background:repeating-conic-gradient(#aaa 0 25%,#ddd 0 50%) 0 0/20px 20px">
<pre id="out"></pre>
<script src="common.js"></script>
<script>
const u24 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255];
const u32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
const ascii = s => [...s].map(c => c.charCodeAt(0));
function cat(parts) {
  const out = new Uint8Array(parts.reduce((a, p) => a + p.length, 0)); let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; } return out;
}
function chunk(tag, payload) {
  const p = Uint8Array.from(payload);
  return cat([ascii(tag), u32(p.length), p, p.length & 1 ? [0] : []]);
}
// keep only the image-bearing chunks of a still WebP (VP8L / VP8 / ALPH)
function imageChunks(u8) {
  return cat(parseWebP(u8).filter(c => ['VP8 ', 'VP8L', 'ALPH'].includes(c.tag))
    .map(c => chunk(c.tag, u8.subarray(c.off, c.off + c.size))));
}
function anmf(x, y, w, h, dur, img) {
  // flags: bit1 = do-not-blend, bit0 = dispose-to-background (0 = none)
  return chunk('ANMF', cat([u24(x / 2), u24(y / 2), u24(w - 1), u24(h - 1), u24(dur), [0x02], img]));
}
function mux(W, H, frames, loop) {
  const body = cat([ascii('WEBP'),
    chunk('VP8X', [0x12, 0, 0, 0, ...u24(W - 1), ...u24(H - 1)]),  // 0x02 anim | 0x10 alpha
    chunk('ANIM', [0, 0, 0, 0, loop & 255, loop >> 8]),            // bg color (transparent), loop count
    ...frames]);
  return cat([ascii('RIFF'), u32(body.length), body]);
}
function diffBBox(a, b, W, H) { // Uint32 views of RGBA
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0, i = y * W; x < W; x++, i++) if (a[i] !== b[i]) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return x1 < 0 ? null : { x0, y0, x1: x1 + 1, y1: y1 + 1 };
}
function draw(x, W, H, k) {
  x.clearRect(0, 0, W, H);
  x.fillStyle = 'rgba(30,120,255,0.5)'; x.fillRect(W * .05, H * .6, W * .9, H * .3);      // semi-transparent bar
  const cx = W * (.15 + .1 * k), cy = H * .35, r = H * .18;
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(255,60,60,1)'); g.addColorStop(1, 'rgba(255,60,60,0)');            // soft alpha edge
  x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
  x.fillStyle = '#fff'; x.font = `bold ${H * .12}px sans-serif`; x.fillText('k=' + k, W * .1, H * .85);
}
$('#go').onclick = () => build().catch(e => log('ERROR', e.stack || e));
async function build() {
  const W = +$('#w').value, H = +$('#h').value;
  const c = mkCanvas(W, H), x = ctx2d(c), tmp = mkCanvas(W, H), tx = ctx2d(tmp);
  const steps = [[0, 100], [1, 100], [2, 150], [2, 50], [3, 100], [4, 100], [5, 100], [6, 300]]; // 3rd/4th identical => merge
  let prev = null, out = [], expect = [], encMs = 0, fullBytes = 0;
  for (const [k, dur] of steps) {
    draw(x, W, H, k);
    const cur = x.getImageData(0, 0, W, H), u32v = new Uint32Array(cur.data.buffer);
    let r = { x0: 0, y0: 0, x1: W, y1: H };
    if (prev) {
      const bb = diffBBox(prev, u32v, W, H);
      if (!bb) { out.at(-1).dur += dur; log('step k=' + k, 'identical, merged'); continue; }
      r = { x0: bb.x0 & ~1, y0: bb.y0 & ~1, x1: bb.x1, y1: bb.y1 };  // offsets must be even
    }
    prev = u32v;
    const w = r.x1 - r.x0, h = r.y1 - r.y0;
    tmp.width = w; tmp.height = h;                                    // resizing clears it
    tx.drawImage(c, r.x0, r.y0, w, h, 0, 0, w, h);
    const t = performance.now(); const blob = await toBlob(tmp, 'image/webp', 1.0); encMs += performance.now() - t;
    const u8 = new Uint8Array(await blob.arrayBuffer());
    out.push({ x: r.x0, y: r.y0, w, h, dur, img: imageChunks(u8), top: parseWebP(u8).map(c => c.tag).join(',') });
    expect.push(cur);
    log('step k=' + k, { x: r.x0, y: r.y0, w, h, dur }, 'bytes', u8.length, 'chunks', out.at(-1).top);
  }
  log('total encode ms', f1(encMs));
  const file = mux(W, H, out.map(f => anmf(f.x, f.y, f.w, f.h, f.dur, f.img)), 0);
  log('muxed', fmtB(file.length)); log(describeWebP(file));
  const blob = new Blob([file], { type: 'image/webp' }), url = URL.createObjectURL(blob);
  $('#im').src = url; $('#dl').href = url; $('#dl').textContent = 'download spike3.webp';

  // self-validate: Chrome's decoder (composited) vs our expected full frames
  const d = new ImageDecoder({ data: file.buffer, type: 'image/webp' });
  await d.tracks.ready; await d.completed;
  const n = d.tracks.selectedTrack.frameCount; log('ImageDecoder frameCount', n, '(expected', expect.length + ')');
  const vc = mkCanvas(W, H), vx = ctx2d(vc);
  for (let i = 0; i < n; i++) {
    const { image } = await d.decode({ frameIndex: i });
    vx.clearRect(0, 0, W, H); vx.drawImage(image, 0, 0); image.close();
    log('frame', i, 'dur(ms)', out[i].dur, 'vs source', cmpRGBA(expect[i], vx.getImageData(0, 0, W, H)));
  }
  log('Now run:  webpmux -info spike3.webp   |   anim_dump -folder dump spike3.webp   |   ffprobe spike3.webp');
}
</script>
